version: "3.8"
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: beershop
      POSTGRES_PASSWORD: beershop
      POSTGRES_DB: beershop
    ports:
      - "5432:5432"
    volumes:
      - beershop_pgdata:/var/lib/postgresql/data

volumes:
  beershop_pgdata:
